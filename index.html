<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button[type="submit"]:active {
            transform: translateY(0);
        }
        
        #message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .dashboard {
            margin-top: 20px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .stat-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .stat-card p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 RFID Attendance System</h1>
        
        <div id="message"></div>
        
        <div id="auth-section">
            <div class="tabs">
                <button class="tab active" id="login-tab" onclick="switchTab('login')">Login</button>
                <button class="tab" id="register-tab" onclick="switchTab('register')">Register</button>
            </div>
            
            <div id="login-content" class="tab-content active">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required placeholder="Enter password">
                    </div>
                    <button type="submit">Login</button>
                </form>
            </div>
            
            <div id="register-content" class="tab-content">
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="register-name" required placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="register-email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="register-password" required placeholder="Choose password">
                    </div>
                    <div class="form-group">
                        <label>Organization</label>
                        <input type="text" id="register-organization" required placeholder="Company Name">
                    </div>
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>
        
        <div id="dashboard-section" style="display:none;">
            <div class="dashboard">
                <div class="stat-card">
                    <h3>Welcome, <span id="user-name"></span>!</h3>
                    <p><strong>Organization:</strong> <span id="user-org"></span></p>
                    <p><strong>Tenant ID:</strong> <span id="tenant-id"></span></p>
                </div>
                
                <div class="stat-card">
                    <h3>📊 Quick Actions</h3>
                    <p><a href="#" onclick="openSpreadsheet()">Open Spreadsheet</a></p>
                    <p><a href="#" onclick="viewDevices()">Manage Devices</a></p>
                    <p><a href="#" onclick="viewEmployees()">Manage Employees</a></p>
                    <p><a href="#" onclick="logout()">Logout</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR GOOGLE APPS SCRIPT DEPLOYMENT URL
        const API_URL = "https://script.google.com/macros/s/AKfycbxwIK6wvmAp0VU7cO4Od2ZAFf3_F6rTK7d0pb7SOHYwUlNYLLkYu-Kc6qJjf_fwJJ7g/exec";
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            document.getElementById(tab + '-tab').classList.add('active');
            document.getElementById(tab + '-content').classList.add('active');
        }
        
        async function handleRegister(event) {
            event.preventDefault();
            
            const email = document.getElementById('register-email').value.trim();
            const name = document.getElementById('register-name').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const organization = document.getElementById('register-organization').value.trim();
            
            if (!email || !name || !password || !organization) {
                showMessage('All fields are required', 'error');
                return;
            }
            
            showMessage('Registering...', 'info');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'register_user',
                        email: email,
                        name: name,
                        password: password,
                        organization: organization
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showMessage('✅ Registration successful! Please login.', 'success');
                    document.getElementById('login-tab').click();
                    document.getElementById('login-email').value = email;
                    document.getElementById('register-form').reset();
                } else {
                    showMessage('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('❌ Connection error: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            
            if (!email || !password) {
                showMessage('Email and password required', 'error');
                return;
            }
            
            showMessage('Logging in...', 'info');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'login_user',
                        email: email,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    sessionStorage.setItem('tenant_id', result.tenant_id);
                    sessionStorage.setItem('user_name', result.name);
                    sessionStorage.setItem('user_email', result.email);
                    sessionStorage.setItem('sheet_url', result.sheet_url);
                    sessionStorage.setItem('organization', result.organization);
                    
                    showDashboard();
                    showMessage('✅ Login successful!', 'success');
                } else {
                    showMessage('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('❌ Connection error: ' + error.message, 'error');
                console.error('Error:', error);
            }
        }
        
        function showDashboard() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            
            document.getElementById('user-name').textContent = sessionStorage.getItem('user_name');
            document.getElementById('user-org').textContent = sessionStorage.getItem('organization');
            document.getElementById('tenant-id').textContent = sessionStorage.getItem('tenant_id');
        }
        
        function openSpreadsheet() {
            window.open(sessionStorage.getItem('sheet_url'), '_blank');
        }
        
        function viewDevices() {
            alert('Device management - Coming soon!');
        }
        
        function viewEmployees() {
            alert('Employee management - Coming soon!');
        }
        
        function logout() {
            sessionStorage.clear();
            location.reload();
        }
        
        function showMessage(message, type) {
            const msgElement = document.getElementById('message');
            msgElement.textContent = message;
            msgElement.className = type;
            msgElement.style.display = 'block';
            
            setTimeout(() => {
                msgElement.style.display = 'none';
            }, 5000);
        }
        
        // Check if already logged in
        if (sessionStorage.getItem('tenant_id')) {
            showDashboard();
        }
    </script>
</body>
</html>
